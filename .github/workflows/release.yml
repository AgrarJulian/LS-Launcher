name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer and update metadata
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Publish installer and update metadata to GitHub Releases
        run: node .github/scripts/publish-release.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
