<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LS25 Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="grain"></i></div>

  <header class="titlebar">
    <div class="tb-brand">
      <img src="../assets/icon.png" alt="" width="18" height="18">
      <span>LS25 Launcher</span>
    </div>
    <div class="tb-controls">
      <button id="tb-min" aria-label="Minimieren"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button id="tb-max" aria-label="Maximieren"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
      <button id="tb-close" class="close" aria-label="Schließen"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" id="nav" aria-label="Hauptnavigation"></nav>
    <main class="content"><div id="view" class="view"></div></main>
  </div>

  <div id="drop-overlay" hidden>
    <div class="drop-box">
      <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <b>Mod-ZIP hier ablegen</b>
      <span>Wird direkt in den aktiven Mod-Ordner kopiert</span>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
